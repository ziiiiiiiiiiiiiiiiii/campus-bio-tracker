<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Apps Script 連線診斷工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-lg w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl space-y-5">
    
    <!-- 標題區 -->
    <div>
      <span class="text-xs font-bold text-cyan-400 tracking-wider uppercase">Connection Tester</span>
      <h1 class="text-xl font-bold text-white mt-1">🧪 Apps Script 試算表寫入測試</h1>
      <p class="text-xs text-slate-400 mt-1">用於驗證 Web App URL 與 Google 試算表之間的資料傳輸。</p>
    </div>

    <!-- 設定 Apps Script 網址 -->
    <div>
      <label class="block text-xs font-medium text-slate-300 mb-1">Apps Script 網頁應用程式網址 (Web App URL)</label>
      <input type="url" id="gasUrl" 
        placeholder="https://script.google.com/macros/s/.../exec" 
        class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 outline-none focus:border-cyan-500 font-mono">
      <p class="text-[11px] text-slate-400 mt-1">網址結尾必須為 <code class="text-amber-400">/exec</code>，不可為 <code class="text-rose-400">/dev</code>。</p>
    </div>

    <!-- 預覽即將發送的測試 Payload -->
    <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs space-y-1">
      <div class="text-slate-400 font-medium border-b border-slate-800 pb-1 flex justify-between">
        <span>即將發送的測試資料內容</span>
        <span class="text-cyan-400">JSON Payload</span>
      </div>
      <div class="font-mono text-[11px] text-slate-300 space-y-0.5 pt-1">
        <p><span class="text-slate-500">• location:</span> "校園生態池 (連線測試)"</p>
        <p><span class="text-slate-500">• gps:</span> "25.175123, 121.437456"</p>
        <p><span class="text-slate-500">• species:</span> "測試水黽 (Test)"</p>
        <p><span class="text-slate-500">• quantity:</span> "1 隻"</p>
        <p><span class="text-slate-500">• notes:</span> "來自測試頁面的連線診斷紀錄"</p>
      </div>
    </div>

    <!-- 測試按鈕組 -->
    <div class="grid grid-cols-2 gap-3">
      <button onclick="testConnection('GET')" id="btnGet" class="py-2.5 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-semibold transition active:scale-95">
        🔍 1. 測試 GET 狀態
      </button>
      <button onclick="testConnection('POST')" id="btnPost" class="py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold transition active:scale-95">
        📤 2. 測試 POST 寫入
      </button>
    </div>

    <!-- 執行日誌輸出視窗 -->
    <div class="bg-slate-950 border border-slate-800 rounded-xl p-3">
      <div class="flex justify-between items-center mb-1.5 text-xs text-slate-400">
        <span>診斷日誌輸出 (Console Log)</span>
        <button onclick="clearLog()" class="text-[10px] text-slate-500 hover:text-slate-300">清空</button>
      </div>
      <pre id="logOutput" class="text-[11px] font-mono text-emerald-400 whitespace-pre-wrap max-h-40 overflow-y-auto leading-relaxed">等待執行測試...</pre>
    </div>

  </div>

  <script>
    // 自動還原上次填入的 URL
    const gasInput = document.getElementById('gasUrl');
    const savedUrl = localStorage.getItem('last_gas_url');
    if (savedUrl) gasInput.value = savedUrl;

    const logEl = document.getElementById('logOutput');

    function log(msg, isError = false) {
      const time = new Date().toLocaleTimeString();
      const formatted = `[${time}] ${msg}\n`;
      if (logEl.innerText === "等待執行測試...") {
        logEl.innerText = formatted;
      } else {
        logEl.innerText += formatted;
      }
      logEl.scrollTop = logEl.scrollHeight;
    }

    function clearLog() {
      logEl.innerText = "等待執行測試...";
    }

    async function testConnection(method) {
      const url = gasInput.value.trim();

      if (!url) {
        alert("請先貼上您的 Google Apps Script 部署網址！");
        return;
      }

      if (!url.startsWith("https://script.google.com/macros/s/")) {
        alert("網址格式不正確！應以 https://script.google.com/macros/s/ 開頭");
        return;
      }

      localStorage.setItem('last_gas_url', url);

      const btn = method === 'GET' ? document.getElementById('btnGet') : document.getElementById('btnPost');
      btn.disabled = true;
      btn.classList.add('opacity-50');

      if (method === 'GET') {
        log(`發起 GET 請求檢查服務狀態...`);
        try {
          const res = await fetch(url);
          const data = await res.json();
          log(`✅ GET 成功！回應狀態: ${data.status} | 訊息: ${data.message}`);
        } catch (err) {
          log(`⚠️ GET 異常：${err.message}`);
          log(`提示：若出現跨網域問題，可直接在瀏覽器另開新分頁貼上該 URL 測試。`);
        }
      } 
      
      else if (method === 'POST') {
        log(`發起 POST 寫入請求至試算表...`);
        
        const now = new Date();
        const testPayload = {
          datetime: now.getFullYear() + "-" + 
                    String(now.getMonth() + 1).padStart(2, '0') + "-" + 
                    String(now.getDate()).padStart(2, '0') + " " + 
                    String(now.getHours()).padStart(2, '0') + ":" + 
                    String(now.getMinutes()).padStart(2, '0') + ":" + 
                    String(now.getSeconds()).padStart(2, '0'),
          location: "校園生態池 (連線測試)",
          gps: "25.175123, 121.437456",
          species: "測試水黽 (Test)",
          quantity: "1 隻",
          notes: "來自網頁連線診斷頁面的測試寫入"
        };

        try {
          // 使用 no-cors 模式發送
          await fetch(url, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(testPayload)
          });

          log(`🎉 POST 封包已成功送出！`);
          log(`👉 請立即開啟您的 Google 試算表，確認是否已新增一列「測試水黽」的資料。`);
        } catch (err) {
          log(`❌ POST 傳送失敗: ${err.message}`, true);
        }
      }

      btn.disabled = false;
      btn.classList.remove('opacity-50');
    }
  </script>
</body>
</html>
