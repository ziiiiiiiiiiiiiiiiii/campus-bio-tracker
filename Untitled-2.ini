
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校園生態調查快速記錄工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl space-y-4">
    
    <!-- 標題區 -->
    <div>
      <span class="text-xs font-bold text-emerald-400 tracking-wider uppercase">Field Survey Tool</span>
      <h1 class="text-xl font-bold text-white mt-0.5">🌿 校園生物資料填報</h1>
      <p class="text-xs text-slate-400 mt-1">時間於送出時自動抓取，GPS 載入時自動偵測。</p>
    </div>

    <!-- GAS 網址設定 -->
    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800">
      <label class="block text-[11px] text-slate-400 mb-1">Apps Script 部署網址 (Web App URL)</label>
      <input type="url" id="gasUrl" 
        placeholder="https://script.google.com/macros/s/.../exec" 
        class="w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-xs text-slate-200 outline-none focus:border-emerald-500 font-mono">
    </div>

    <!-- 調查表單 -->
    <form id="recordForm" class="space-y-3.5">
      
      <!-- GPS 定位狀態（自動獲取，亦可手動重整） -->
      <div class="bg-slate-950/70 p-3 rounded-xl border border-slate-700/60">
        <div class="flex justify-between items-center mb-1">
          <span class="text-xs font-semibold text-cyan-400">🌐 手機 GPS 定位</span>
          <button type="button" onclick="autoGetGPS()" class="text-[11px] text-cyan-400 hover:text-cyan-300 underline">
            重新取得定位
          </button>
        </div>
        <input type="text" id="gpsField" readonly placeholder="正在抓取手機 GPS 經緯度..." 
          class="w-full bg-slate-900 border border-slate-800 rounded p-2 text-xs font-mono text-emerald-400 outline-none">
        <p id="gpsStatus" class="text-[10px] text-slate-400 mt-1">📡 頁面已自動啟動定位服務...</p>
      </div>

      <!-- 校園地點 -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">校園觀察地點 <span class="text-rose-400">*</span></label>
        <input type="text" id="locationField" required placeholder="例如：生態池木棧道、操場西側樹林" 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none focus:border-emerald-500">
      </div>

      <!-- 物種名稱 -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">物種名稱 <span class="text-rose-400">*</span></label>
        <input type="text" id="speciesField" required placeholder="例如：水黽、黑冠麻鷺、大花咸豐草" 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none focus:border-emerald-500">
      </div>

      <!-- 數量與單位 -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">數量與單位 <span class="text-rose-400">*</span></label>
        <input type="text" id="quantityField" required placeholder="例如：3 隻、1 棵、大約 10 朵" 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none focus:border-emerald-500">
      </div>

      <!-- 備註 -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">備註說明 (選填)</label>
        <textarea id="notesField" rows="2" placeholder="觀察紀錄，如：成鳥正在草地覓食、群聚漂浮於水面..." 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white outline-none focus:border-emerald-500"></textarea>
      </div>

      <!-- 提交按鈕 -->
      <button type="submit" id="submitBtn" 
        class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-xl text-sm shadow-lg transition active:scale-98">
        📤 送出紀錄 (自動記下時間與座標)
      </button>
    </form>

    <!-- 狀態反饋提示 -->
    <div id="statusAlert" class="hidden text-center text-xs p-3 rounded-lg border"></div>

  </div>

  <script>
    const gasInput = document.getElementById('gasUrl');
    const gpsField = document.getElementById('gpsField');
    const gpsStatus = document.getElementById('gpsStatus');
    const statusAlert = document.getElementById('statusAlert');
    const submitBtn = document.getElementById('submitBtn');

    // 1. 自動載入先前存過的 GAS 網址
    const savedUrl = localStorage.getItem('last_gas_url');
    if (savedUrl) gasInput.value = savedUrl;

    // 2. 手機 GPS 自動取得函式
    function autoGetGPS() {
      if (!navigator.geolocation) {
        gpsStatus.innerText = "❌ 此裝置或瀏覽器不支援定位。";
        gpsField.value = "未取得 (不支援)";
        return;
      }

      gpsStatus.innerText = "📡 正在定位中，請允許瀏覽器存取位置權限...";
      gpsStatus.className = "text-[10px] text-amber-400 mt-1";

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(6);
          const lng = pos.coords.longitude.toFixed(6);
          const acc = pos.coords.accuracy.toFixed(1);
          
          gpsField.value = `${lat}, ${lng}`;
          gpsStatus.innerText = `✅ 定位成功！誤差半徑約 ±${acc} 公尺`;
          gpsStatus.className = "text-[10px] text-emerald-400 mt-1";
        },
        (err) => {
          gpsStatus.innerText = `⚠️ 定位失敗: ${err.message} (請確認開啟手機定位服務與 HTTPS)`;
          gpsStatus.className = "text-[10px] text-rose-400 mt-1";
          gpsField.value = "未取得 (定位失敗)";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // 網頁載入時自動執行一次定位
    window.addEventListener('DOMContentLoaded', autoGetGPS);

    // 3. 表單送出處理
    document.getElementById('recordForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const url = gasInput.value.trim();
      if (!url) {
        alert("請先輸入您的 Google Apps Script 部署網址！");
        return;
      }
      localStorage.setItem('last_gas_url', url);

      // 送出時「當下」自動生成本地標準時間字串 (格式: YYYY-MM-DD HH:MM:SS)
      const now = new Date();
      const timestamp = now.getFullYear() + "-" + 
        String(now.getMonth() + 1).padStart(2, '0') + "-" + 
        String(now.getDate()).padStart(2, '0') + " " + 
        String(now.getHours()).padStart(2, '0') + ":" + 
        String(now.getMinutes()).padStart(2, '0') + ":" + 
        String(now.getSeconds()).padStart(2, '0');

      const payload = {
        datetime: timestamp,
        location: document.getElementById('locationField').value.trim(),
        gps: gpsField.value || "未記錄",
        species: document.getElementById('speciesField').value.trim(),
        quantity: document.getElementById('quantityField').value.trim(),
        notes: document.getElementById('notesField').value.trim()
      };

      submitBtn.disabled = true;
      submitBtn.innerText = "⏳ 正在傳輸至試算表...";

      try {
        await fetch(url, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        statusAlert.className = "text-center text-xs p-3 rounded-lg bg-emerald-950 text-emerald-300 border border-emerald-700 block";
        statusAlert.innerText = `🎉 寫入成功！時間：${timestamp}`;

        // 清空打字輸入框，保留 GPS 座標
        document.getElementById('locationField').value = '';
        document.getElementById('speciesField').value = '';
        document.getElementById('quantityField').value = '';
        document.getElementById('notesField').value = '';

        // 重新更新一次 GPS 定位
        autoGetGPS();
      } catch (err) {
        statusAlert.className = "text-center text-xs p-3 rounded-lg bg-rose-950 text-rose-300 border border-rose-700 block";
        statusAlert.innerText = `❌ 傳送失敗: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "📤 送出紀錄 (自動記下時間與座標)";
      }
    });
  </script>
</body>

</html>
